<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">
        <h1>Lista de tarefas</h1>
        <form action="/" method="POST">
            <input type="text" name="titulo" placeholder="Adicione a sua tarefa" required>
            <button type="submit">Adicionar</button>
        </form>
        <ul class="task-list">
            {% for tarefa in tarefas %}
            <li class="{% if tarefa.concluida %}completed{% endif %}">
                <div class="task-container" style="display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" class="task-checkbox" data-id="{{ tarefa.id_tarefa }}" {% if tarefa.concluida %}checked{% endif %}>
                        <span class="task-text">{{ tarefa.titulo }}</span>
                    </div>
                    <div class="action-icons">
                        <a href="/tarefas/editar/{{ tarefa.id_tarefa }}" title="Editar">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a href="#" class="delete-task" data-id="{{ tarefa.id_tarefa }}" title="Excluir">
                            <i class="bi bi-trash"></i>
                        </a>
                    </div>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll(".task-checkbox").forEach(checkbox => {
                checkbox.addEventListener("change", function() {
                    const tarefaId = this.getAttribute("data-id");
                    const concluida = this.checked;
                    const taskItem = this.closest("li");
            
                    fetch(`/atualizar_tarefa/${tarefaId}`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": document.querySelector('meta[name="csrf-token"]').content
                        },
                        body: JSON.stringify({ concluida: concluida })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            taskItem.classList.toggle("completed", concluida);
                        } else {
                            alert("Erro ao atualizar a tarefa.");
                            this.checked = !concluida;
                        }
                    })
                    .catch(error => {
                        console.error("Erro:", error);
                        this.checked = !concluida;
                    });
                });
            });
            
            document.addEventListener("click", function(event) {
                const deleteBtn = event.target.closest(".delete-task");
                
                if (deleteBtn) {
                    event.preventDefault();
                    const tarefaId = deleteBtn.getAttribute("data-id");
                    const taskItem = deleteBtn.closest("li");
                    
                    if (confirm("Tem certeza que deseja excluir esta tarefa?")) {
                        fetch(`/excluir_tarefa/${tarefaId}`, {
                            method: "DELETE",
                            headers: {
                                "Content-Type": "application/json",
                            }
                        })
                        .then(response => {
                            if (!response.ok) throw new Error("Erro na requisição");
                            return response.json();
                        })
                        .then(data => {
                            if (data.success) {
                                taskItem.style.transition = "opacity 0.3s";
                                taskItem.style.opacity = "0";
                                setTimeout(() => taskItem.remove(), 300);
                            } else {
                                throw new Error(data.message || "Erro ao excluir");
                            }
                        })
                        .catch(error => {
                            console.error("Erro:", error);
                            alert(error.message);
                        });
                    }
                }
            });
        });
    </script>
</body>
</html>
